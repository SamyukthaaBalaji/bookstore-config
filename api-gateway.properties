server.port=8080
spring.application.name=api-gateway-book

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

spring.cloud.gateway.server.webflux.routes[0].id=book-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://book-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/books/**

spring.cloud.gateway.server.webflux.routes[1].id=review-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://review-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reviews/**

spring.cloud.gateway.server.webflux.routes[2].id=recommendation-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://recommendation-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendations/**
